AWSTemplateFormatVersion: 2010-09-09
Description: GridVote WebSocket API + Lambdas + DynamoDB

Resources:

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GridVotePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                  - execute-api:ManageConnections
                  - lambda:InvokeFunction
                Resource: "*"

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TableName: Connections

  TracksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: trackName
          AttributeType: S
      KeySchema:
        - AttributeName: trackName
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TableName: Tracks

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TableName: Sessions

  OnConnectLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          const ddb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
            const connectionId = event.requestContext.connectionId;

            await ddb.put({
              TableName: "Connections",
              Item: { connectionId }
            }).promise();

            console.log("Connected:", connectionId);
            return { statusCode: 200 };
          };

  OnDisconnectLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          const ddb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
            const connectionId = event.requestContext.connectionId;

            await ddb.delete({
              TableName: "Connections",
              Key: { connectionId }
            }).promise();

            console.log("Disconnected:", connectionId);
            return { statusCode: 200 };
          };

  StartSessionLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          const ddb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
            console.log("Start session triggered");

            const tracksData = await ddb.scan({ TableName: "Tracks" }).promise();
            const tracks = tracksData.Items.map(t => t.trackName);
            const selected = tracks.sort(() => 0.5 - Math.random()).slice(0, 3);

            const connections = await ddb.scan({ TableName: "Connections" }).promise();

            const apigw = new AWS.ApiGatewayManagementApi({
              endpoint: process.env.WS_ENDPOINT
            });

            const message = {
              type: "sessionStarted",
              tracks: selected
            };

            const postCalls = connections.Items.map(async ({ connectionId }) => {
              try {
                await apigw.postToConnection({
                  ConnectionId: connectionId,
                  Data: JSON.stringify(message)
                }).promise();
              } catch (err) {
                console.log("Failed to send to", connectionId, err);
              }
            });

            await Promise.all(postCalls);

            return { statusCode: 200 };
          };

  VoteLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          const ddb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
            const body = JSON.parse(event.body);
            const track = body.track;

            await ddb.update({
              TableName: "Sessions",
              Key: { sessionId: "current" },
              UpdateExpression: "ADD votes.#t :inc",
              ExpressionAttributeNames: { "#t": track },
              ExpressionAttributeValues: { ":inc": 1 }
            }).promise();

            console.log("Vote received:", track);
            return { statusCode: 200 };
          };

  EndSessionLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          const ddb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
            console.log("End session");

            const session = await ddb.get({
              TableName: "Sessions",
              Key: { sessionId: "current" }
            }).promise();

            const votes = session.Item?.votes || {};

            const winner = Object.entries(votes)
              .sort((a, b) => b[1] - a[1])[0]?.[0] || "No votes";

            const connections = await ddb.scan({ TableName: "Connections" }).promise();

            const apigw = new AWS.ApiGatewayManagementApi({
              endpoint: process.env.WS_ENDPOINT
            });

            const message = {
              type: "sessionEnded",
              winner
            };

            const postCalls = connections.Items.map(async ({ connectionId }) => {
              try {
                await apigw.postToConnection({
                  ConnectionId: connectionId,
                  Data: JSON.stringify(message)
                }).promise();
              } catch (err) {
                console.log("Failed to send to", connectionId, err);
              }
            });

            await Promise.all(postCalls);

            return { statusCode: 200 };
          };

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OnConnectLambda.Arn

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OnDisconnectLambda.Arn

  StartSessionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StartSessionLambda.Arn

  VoteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt VoteLambda.Arn

  EndSessionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EndSessionLambda.Arn

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: MOCK

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      Target: !Sub "integrations/${DisconnectIntegration}"

  StartSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "startSession"
      Target: !Sub "integrations/${StartSessionIntegration}"

  VoteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "vote"
      Target: !Sub "integrations/${VoteIntegration}"

  EndSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "endSession"
      Target: !Sub "integrations/${EndSessionIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      Target: !Sub "integrations/${DefaultIntegration}"

  OnConnectLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnConnectLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  OnDisconnectLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnDisconnectLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  StartSessionLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StartSessionLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  VoteLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VoteLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  EndSessionLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EndSessionLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

Outputs:
  WebSocketURL:
    Description: WebSocket URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
